version: '3.8'

services:
  gateway:
    environment:
      - NODE_ENV=development
    volumes:
      - ./services/gateway:/app
      - /app/node_modules

  ai:
    volumes:
      - ./services/ai:/app

  web:
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
