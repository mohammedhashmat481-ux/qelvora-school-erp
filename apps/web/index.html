<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Face Recognition Authentication System — Secure login with AI-powered face verification and GPS location locking." />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Qelvora School CRM — Secure School Management</title>
    <script>
      // Suppress third-party Chrome Extension errors from polluting the console and breaking code execution
      window.addEventListener('error', function(event) {
        if (event.filename && (event.filename.includes('chrome-extension://') || event.filename.includes('extension'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        const reason = event.reason;
        if (reason && (
          (reason.stack && (reason.stack.includes('chrome-extension://') || reason.stack.includes('extension'))) ||
          (reason.message && (reason.message.includes('Invidious') || reason.message.includes('chrome-extension')))
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
