services:
  postgres:
    image: postgres:16-alpine
    container_name: school_crm_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qelvora_school_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: school_crm_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: school_crm_ai
    restart: always
    environment:
      - PORT=5000
      - AI_INTERNAL_SECRET=${AI_INTERNAL_SECRET:-internal_shared_secret_school_crm_ai_service_token}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: school_crm_gateway
    restart: always
    environment:
      - PORT=8000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/qelvora_school_crm?schema=public
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai:5000
      - AI_INTERNAL_SECRET=${AI_INTERNAL_SECRET:-internal_shared_secret_school_crm_ai_service_token}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_school_crm_platform_2026}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ENABLE_MOCK_AI=${ENABLE_MOCK_AI:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_started

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: school_crm_web
    restart: always
    ports:
      # Isolated non-conflicting internal loopback port
      - "127.0.0.1:3850:80"
    depends_on:
      - gateway

volumes:
  postgres_data:
  redis_data:
